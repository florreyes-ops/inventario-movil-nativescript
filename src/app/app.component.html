<RadSideDrawer #drawer>
  <GridLayout tkDrawerContent rows="auto, *" class="drawer">
    <StackLayout row="0" class="drawer-header">
      <Label text="Inventario Móvil" class="drawer-title"></Label>
      <Label text="NativeScript + Angular" class="drawer-subtitle"></Label>
    </StackLayout>

    <ScrollView row="1">
      <StackLayout class="drawer-list">
        <GridLayout
          *ngFor="let item of navigationItems"
          columns="42, *"
          class="drawer-item"
          (tap)="navigateTo(item.route)">
          <Image col="0" [src]="item.icon" class="drawer-icon"></Image>
          <Label col="1" [text]="item.title" class="drawer-label"></Label>
        </GridLayout>
      </StackLayout>
    </ScrollView>
  </GridLayout>

  <page-router-outlet tkMainContent></page-router-outlet>
</RadSideDrawer>
